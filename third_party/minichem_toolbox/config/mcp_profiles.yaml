schema_version: 2
# ARCHE Harness 将模型和软件缓存统一保存在仓库忽略的 local_data 中；这里使用
# 相对于 vendored MiniChem 根目录的路径，使 worker 解析出的缓存根与各子目录
# 位于同一真实目录，不依赖源码目录中的兼容软链接。
model_cache_root: ../../local_data/model_cache/minichem

profiles:
  core:
    description: RDKit, ASE, NumPy, SciPy, Sella, and deterministic analysis.
    environment: arche
    use_project_model_cache: true
    health_checks:
      modules: [ase, numpy, rdkit, scipy, sella, yaml]
    backends: [rdkit, rdkit_etkdg, rdkit_gasteiger, format_conversion, internal_statistics, internal_reaction_analysis, internal_reactive_complex, internal_vibrations, internal_spectroscopy, internal_plotting, internal_thermochemistry]

  workflows:
    description: QCElemental and cclib structured chemistry records, output parsing, and ARCHE-Chem Gaussian code generation.
    environment: arche
    health_checks:
      modules: [qcelemental, cclib, openai]
    backends: [qcelemental, cclib, gaussian_codegen]

  quantum:
    description: xTB and Open Babel molecular preparation and low-cost quantum chemistry.
    environment: arche
    health_checks:
      modules: [ase, openbabel]
      commands: [xtb, obabel]
    command_variables:
      CHEMGRAPH_XTB_COMMAND: xtb
    backends: [openbabel, xtb]

  reaction:
    description: CREST conformer search and pysisyphus reaction-path workflows using xTB.
    environment: arche
    health_checks:
      modules: [pysisyphus]
      commands: [crest, pysis, xtb]
    command_variables:
      CHEMGRAPH_CREST_COMMAND: crest
      CHEMGRAPH_PYSIS_COMMAND: pysis
    backends: [crest, pysisyphus]

  rxnmapper:
    description: Optional RXNMapper atom mapping with RDKit validation.
    environment: arche
    use_project_model_cache: true
    health_checks:
      modules: [rxnmapper, rdkit]
      package_resources:
        - resource_id: rxnmapper_albert_uspto_all_1310k
          module: rxnmapper
          relative_path: models/transformers/albert_heads_8_uspto_all_1310k
          path_environment_variable: MINICHEM_RXNMAPPER_MODEL_PATH
          required_files:
            - config.json
            - pytorch_model.bin
            - special_tokens_map.json
            - tokenizer_config.json
            - training_args.bin
            - vocab.txt
    backends: [rxnmapper]

  fairchem:
    description: FairChem UMA molecular optimization in the unified CUDA-capable runtime.
    environment: arche
    use_project_model_cache: true
    environment_variables:
      HF_HOME: ../../local_data/model_cache/minichem/huggingface
      HF_HUB_CACHE: ../../local_data/model_cache/minichem/huggingface/hub
      HF_XET_CACHE: ../../local_data/model_cache/minichem/huggingface/xet
      TORCH_HOME: ../../local_data/model_cache/minichem/torch
      FAIRCHEM_CACHE_DIR: ../../local_data/model_cache/minichem/fairchem
    health_checks:
      modules: [fairchem.core, torch, ase]
    backends: [fairchem_uma]

  ash_neb:
    description: ASH/KNARR NEB and the composite ARCHE TS Action in the unified runtime.
    environment: arche
    use_project_model_cache: true
    environment_variables:
      HF_HOME: ../../local_data/model_cache/minichem/huggingface
      HF_HUB_CACHE: ../../local_data/model_cache/minichem/huggingface/hub
      HF_XET_CACHE: ../../local_data/model_cache/minichem/huggingface/xet
      TORCH_HOME: ../../local_data/model_cache/minichem/torch
      FAIRCHEM_CACHE_DIR: ../../local_data/model_cache/minichem/fairchem
    health_checks:
      modules: [ash, fairchem.core, torch, ase, numpy, rdkit, rxnmapper]
      package_resources:
        - resource_id: rxnmapper_albert_uspto_all_1310k
          module: rxnmapper
          relative_path: models/transformers/albert_heads_8_uspto_all_1310k
          path_environment_variable: MINICHEM_RXNMAPPER_MODEL_PATH
          required_files:
            - config.json
            - pytorch_model.bin
            - special_tokens_map.json
            - tokenizer_config.json
            - training_args.bin
            - vocab.txt
    backends: [ash_neb_uma]

  sella:
    description: Sella geometry and transition-state optimization with xTB calculators.
    environment: arche
    health_checks:
      modules: [ase, numpy, sella]
    backends: [sella]

  gaussian:
    description: Licensed Gaussian 16 C.01 and formatted-checkpoint conversion.
    environment: arche
    health_checks:
      modules: [cclib]
      commands: [g16, formchk]
      external_commands:
        - .mini_software_cache/gaussian/g16/install/g16/g16
        - .mini_software_cache/gaussian/g16/install/g16/formchk
    command_variables:
      CHEMGRAPH_GAUSSIAN_COMMAND: .mini_software_cache/gaussian/g16/install/g16/g16
      CHEMGRAPH_GAUSSIAN_FORMCHK_COMMAND: .mini_software_cache/gaussian/g16/install/g16/formchk
    path_entries: [.mini_software_cache/gaussian/g16/install/g16]
    environment_variables:
      g16root: .mini_software_cache/gaussian/g16/install
      GAUSS_EXEDIR: .mini_software_cache/gaussian/g16/install/g16
      GAUSS_SCRDIR: .mini_software_cache/gaussian/g16/scratch
    backends: [gaussian]

  goodvibes:
    description: GoodVibes thermochemistry, ensemble, selectivity, and reaction-profile analysis.
    environment: arche
    health_checks:
      modules: [goodvibes, numpy, pandas, yaml]
      commands: [goodvibes]
    command_variables:
      CHEMGRAPH_GOODVIBES_COMMAND: goodvibes
    backends: [goodvibes]

  multiwfn:
    description: Multiwfn noGUI wavefunction and electron-density analysis.
    environment: arche
    health_checks:
      commands: [Multiwfn_noGUI]
      external_commands:
        - .mini_software_cache/multiwfn/2026.7.15/Multiwfn_2026.7.15_bin_Linux_noGUI/Multiwfn_noGUI
    command_variables:
      CHEMGRAPH_MULTIWFN_COMMAND: .mini_software_cache/multiwfn/2026.7.15/Multiwfn_2026.7.15_bin_Linux_noGUI/Multiwfn_noGUI
    path_entries:
      - .mini_software_cache/multiwfn/2026.7.15/Multiwfn_2026.7.15_bin_Linux_noGUI
    environment_variables:
      OMP_STACKSIZE: 2G
    backends: [multiwfn]
